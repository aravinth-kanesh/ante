# Production stack: PostgreSQL, the FastAPI backend, and a Caddy container that serves
# the built frontend and terminates TLS. Set the variables below in a `.env` file next
# to this one (see backend/.env.example), then run: docker compose up -d --build
#
# Required: JWT_SECRET. For a real model set LLM_BASE_URL/LLM_API_KEY/LLM_MODEL, or set
# LLM_FAKE=1 to run without one. Set SITE_ADDRESS to your domain for automatic HTTPS.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ante
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ante}
      POSTGRES_DB: ante
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ante"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    # Every optional setting the user puts in .env (LLM_*, SMTP_*, WEB_SEARCH_ENABLED,
    # REQUIRE_EMAIL_VERIFICATION, COOKIE_SECURE, ...) is passed straight through; only
    # values missing from .env are left to their defaults (an empty value would fail to
    # parse). The fixed and computed ones are set explicitly below.
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: postgresql+psycopg2://ante:${DB_PASSWORD:-ante}@db:5432/ante
      BACKEND_CORS_ORIGINS: ${SITE_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  db-data:
